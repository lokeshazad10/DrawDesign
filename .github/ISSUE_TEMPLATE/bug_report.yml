name: Bug report
description: Report a problem with DrawDesign
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Please do not include passwords, tokens, or other sensitive
        information.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots or a screen recording if they help explain the problem.
  - type: input
    id: environment
    attributes:
      label: Environment details
      description: Browser and version, operating system, and device/input type.
      placeholder: "e.g. Firefox 140, Windows 11, mouse"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other relevant information.
